[project]
name = "ai-news-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "feedparser>=6.0.14",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
