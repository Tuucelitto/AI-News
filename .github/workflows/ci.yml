# Runs the same checks as local development on every push to main and every pull request.
# Tests never call Gemini or real RSS feeds, so no secrets are needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (exactly as locked)
        # Uses backend/.python-version (3.13); fails if uv.lock is out of date.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (lint + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Upgrade npm
        # npm 10 (bundled with Node 22) crashes while resolving peer dependencies.
        run: npm install -g npm@11

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build-only
